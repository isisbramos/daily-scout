name: CodeQL

# Análise estática do código Python (SAST) — diferente do security.yml, que audita
# vulnerabilidades conhecidas em dependências. Isolado do pipeline da newsletter:
# uma falha aqui NUNCA pode bloquear o envio diário.

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.py'
  schedule:
    # Segunda-feira 07:00 UTC — depois do security.yml (06:00), antes dos PRs do Dependabot
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
