name: AYA — Content Report (Weekly)

on:
  schedule:
    # Segunda-feira 9:00 BRT = 12:00 UTC (BRT é UTC-3), depois do pipeline diário.
    - cron: '0 12 * * 1'

  # Trigger manual para rodar sob demanda.
  workflow_dispatch:
    inputs:
      last:
        description: 'Quantas edições recentes analisar (ex: 30)'
        required: false
        default: '30'

permissions:
  contents: write
  actions: read   # necessário para o gh api baixar os artifacts debug-NNN

jobs:
  content-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Puxa os ratings da planilha pública e grava feedback_score no editions.jsonl.
      # Não-fatal: se a planilha estiver fora do ar, o relatório ainda roda com o que há.
      - name: Join feedback (Sheet → editions.jsonl)
        continue-on-error: true
        env:
          FEEDBACK_CSV_URL: ${{ secrets.FEEDBACK_CSV_URL }}
        run: python feedback_join.py

      # Baixa os artifacts debug (curation+items) das edições recentes que ainda não
      # têm audit, roda o audit_agent (LLM-as-judge) e popula o Scorecard de Qualidade.
      # Idempotente (--skip-existing) e não-fatal: falha aqui nunca bloqueia o relatório.
      - name: Audit recent editions (artifacts → audit)
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAST: ${{ github.event.inputs.last || '30' }}
        run: |
          mkdir -p debug
          EDITIONS=$(python -c "import json; \
          lines=[l for l in open('memory/editions.jsonl') if l.strip()]; \
          eds=[json.loads(l).get('edition') for l in lines]; \
          print(' '.join(e for e in eds[-int('${LAST}'):] if e))")
          echo "Janela de edições: $EDITIONS"
          for n in $EDITIONS; do
            if [ -f "debug/edition_${n}_audit.json" ]; then echo "#$n já auditada"; continue; fi
            id=$(gh api "repos/${{ github.repository }}/actions/artifacts" --paginate \
                 --jq ".artifacts[] | select(.name==\"debug-$n\") | .id" | head -1)
            if [ -n "$id" ]; then
              gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "/tmp/debug-$n.zip" \
                && unzip -o -q "/tmp/debug-$n.zip" -d debug/ && echo "baixado debug-$n"
            else
              echo "sem artifact debug-$n (expirado?)"
            fi
          done
          python audit_agent.py --all --skip-existing || echo "audit parcial — seguindo para o relatório"

      - name: Generate content report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python content_report.py --last ${{ github.event.inputs.last || '30' }} --quiet

      # Commita o relatório + o editions.jsonl enriquecido de volta. Defensivo: nunca
      # falha o job (mesmo padrão da persistência de memória no pipeline diário).
      - name: Persist report + feedback
        if: success()
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain reports/ memory/editions.jsonl debug/)" ]; then
            echo "Sem mudanças — nada a commitar."
            exit 0
          fi
          git config user.name "aya-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ memory/editions.jsonl debug/
          git commit -m "chore(report): relatório de conteúdo semanal $(date +%Y-%m-%d)" || { echo "nada a commitar"; exit 0; }
          git pull --rebase --autostash origin main || echo "pull --rebase falhou — seguindo para push"
          git push origin HEAD:main || echo "push falhou — relatório não persistido (sem impacto no pipeline)"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-report
          path: reports/
          retention-days: 90
