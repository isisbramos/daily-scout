name: Daily Scout Pipeline

on:
  schedule:
    # 7:55 AM BRT = 10:55 UTC (BRT is UTC-3)
    - cron: '0 10 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      edition_number:
        description: 'Edition number (e.g., 001)'
        required: false
        default: '001'
      dry_run:
        description: 'Dry run — roda tudo mas NÃO envia email (true/false)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Calculate edition number
        id: edition
        run: |
          # Calculate days since first run (or use input)
          if [ -n "${{ github.event.inputs.edition_number }}" ]; then
            echo "number=${{ github.event.inputs.edition_number }}" >> $GITHUB_OUTPUT
          else
            # Days since launch (2026-03-23 = edition #001)
            DAYS=$(( ($(date +%s) - $(date -d "2026-03-22" +%s)) / 86400 ))
            printf "number=%03d\n" $DAYS >> $GITHUB_OUTPUT
          fi

      - name: Run Daily Scout pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          EDITION_NUMBER: ${{ steps.edition.outputs.number }}
          FEEDBACK_BASE_URL: ${{ secrets.FEEDBACK_BASE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SOCIAL_ENABLED: 'false'
          DEBUG_SAVE: 'true'
        run: python pipeline.py

      - name: Persist editorial memory
        # Isolado: a newsletter já foi enviada no passo anterior. Qualquer falha de git
        # (branch protection, detached HEAD, etc.) NÃO pode falhar o job nem afetar o envio.
        if: success() && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain memory/editions.jsonl)" ]; then
            echo "Sem mudanças na memória editorial — nada a commitar."
            exit 0
          fi
          git config user.name "aya-bot"
          git config user.email "actions@users.noreply.github.com"
          git add memory/editions.jsonl
          git commit -m "chore(memory): registra edição ${{ steps.edition.outputs.number }}" || { echo "nada a commitar"; exit 0; }
          # Atualiza antes de empurrar; nunca falha o passo (HEAD:main funciona mesmo em detached HEAD)
          git pull --rebase --autostash origin main || echo "pull --rebase falhou — seguindo para push"
          git push origin HEAD:main || echo "push falhou — memória não persistida hoje (newsletter já enviada, sem impacto)"

      - name: Upload output artifacts (newsletter + social)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-${{ steps.edition.outputs.number }}
          path: output/
          retention-days: 30

      - name: Upload debug artifacts (curation + pre-filter data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ steps.edition.outputs.number }}
          path: debug/
          retention-days: 30

      - name: Upload pipeline logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ steps.edition.outputs.number }}
          path: "*.log"
          retention-days: 7
