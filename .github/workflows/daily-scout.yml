name: Daily Scout Pipeline

on:
  schedule:
    # Dispara cedo (03:37 BRT = 06:37 UTC) de propósito.
    # O envio é imediato (about_to_send), então a entrega = hora do run.
    # O cron do GitHub Actions é best-effort e atrasa 1-5h, principalmente no
    # topo da hora. Disparando cedo e num minuto fora do pico (:37, não :00),
    # mesmo o pior atraso histórico cai antes das 8h BRT — nunca depois.
    # Para entregar mais perto das 8h (aceitando risco de atraso), suba o horário.
    - cron: '37 6 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      edition_number:
        description: 'Edition number (e.g., 001)'
        required: false
        default: '001'
      dry_run:
        description: 'Dry run — roda tudo mas NÃO envia email (true/false)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Calculate edition number
        id: edition
        run: |
          # Calculate days since first run (or use input)
          if [ -n "${{ github.event.inputs.edition_number }}" ]; then
            echo "number=${{ github.event.inputs.edition_number }}" >> $GITHUB_OUTPUT
          else
            # Days since launch (2026-03-23 = edition #001)
            DAYS=$(( ($(date +%s) - $(date -d "2026-03-22" +%s)) / 86400 ))
            printf "number=%03d\n" $DAYS >> $GITHUB_OUTPUT
          fi

      - name: Run Daily Scout pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          EDITION_NUMBER: ${{ steps.edition.outputs.number }}
          FEEDBACK_BASE_URL: ${{ secrets.FEEDBACK_BASE_URL }}
          TRACK_BASE_URL: ${{ secrets.TRACK_BASE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SOCIAL_ENABLED: 'false'
          DEBUG_SAVE: 'true'
        run: python pipeline.py

      - name: Persist editorial memory
        # Isolado: a newsletter já foi enviada no passo anterior. Qualquer falha de git
        # (branch protection, detached HEAD, etc.) NÃO pode falhar o job nem afetar o envio.
        # scripts/persist_to_git.sh faz retry do push e, se esgotar, avisa alto (step
        # summary + exit != 0) em vez de engolir a falha em silêncio.
        if: success() && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: 'scripts/persist_to_git.sh memory/editions.jsonl "chore(memory): registra edição ${{ steps.edition.outputs.number }}"'

      - name: Persist vault note (Stage A — outbox pro vault pessoal)
        # Mesmo isolamento do passo de memória editorial: a newsletter já foi enviada,
        # falha de git aqui não pode afetar o envio. A cópia real pro vault (Stage B)
        # roda localmente — ver scripts/sync_to_vault.py.
        if: success() && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: 'scripts/persist_to_git.sh vault-outbox/ "chore(vault): nota da edição ${{ steps.edition.outputs.number }}"'

      - name: Upload output artifacts (newsletter + social)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-${{ steps.edition.outputs.number }}
          path: output/
          retention-days: 30

      - name: Upload debug artifacts (curation + pre-filter data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ steps.edition.outputs.number }}
          path: debug/
          retention-days: 30

      - name: Upload pipeline logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ steps.edition.outputs.number }}
          path: "*.log"
          retention-days: 7
