name: Daily Scout Pipeline

on:
  schedule:
    # FALLBACK. O gatilho principal é externo: um scheduler (cron-job.org) chama
    # workflow_dispatch às 7h55 BRT — ver ops/disparo-externo.md.
    # Este cron nativo continua aqui só como rede de segurança, e o guard abaixo
    # impede envio duplicado quando o externo já mandou a edição do dia.
    # O cron do GitHub Actions é best-effort: nas últimas 40 execuções (out-nov/2026)
    # disparou entre 4,5h e 10,2h depois do horário (média 7h), ou seja, entre ~8h e
    # ~13h50 BRT. Não dá pra compensar com horário mais cedo: o atraso varia demais.
    - cron: '37 6 * * *'

  # Disparo externo (principal), manual e testes
  workflow_dispatch:
    inputs:
      edition_number:
        description: 'Edition number (e.g., 239). Vazio = calcula pela data.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — roda tudo mas NÃO envia email (true/false)'
        type: boolean
        required: false
        default: false
      force:
        description: 'Force — envia mesmo se a edição já estiver registrada (reenvio deliberado)'
        type: boolean
        required: false
        default: false
      trigger:
        description: 'Origem do disparo, só para métrica (external | manual)'
        required: false
        default: 'manual'

permissions:
  contents: write

# Uma execução por vez. Sem cancelar a que está rodando: cancelar no meio do envio
# seria pior do que esperar. Uma execução pendente atrás dela passa pelo guard depois.
concurrency:
  group: aya-daily-send
  cancel-in-progress: false

jobs:
  guard:
    # Decide se a edição de hoje ainda precisa sair. Só stdlib: roda em ~10s.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
      edition: ${{ steps.guard.outputs.edition }}
    steps:
      - name: Checkout (tip da branch, não o SHA do disparo)
        # Um run que esperou na fila de concurrency tem GITHUB_SHA antigo e não
        # enxergaria a edição que o run anterior acabou de registrar no main.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Já enviou hoje?
        id: guard
        env:
          EDITION_NUMBER: ${{ github.event.inputs.edition_number }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
          TRIGGER: ${{ github.event.inputs.trigger }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/edition_guard.py

  run-pipeline:
    needs: guard
    # Fail-open: se o próprio guard quebrar (checkout, runner), skip vem vazio e o
    # pipeline roda mesmo assim. Melhor risco de duplicidade do que edição que não sai.
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Calculate edition number
        id: edition
        run: |
          # Calculate days since first run (or use input)
          if [ -n "${{ github.event.inputs.edition_number }}" ]; then
            echo "number=${{ github.event.inputs.edition_number }}" >> $GITHUB_OUTPUT
          else
            # Days since launch (2026-03-23 = edition #001)
            DAYS=$(( ($(date +%s) - $(date -d "2026-03-22" +%s)) / 86400 ))
            printf "number=%03d\n" $DAYS >> $GITHUB_OUTPUT
          fi

      - name: Run Daily Scout pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          EDITION_NUMBER: ${{ steps.edition.outputs.number }}
          FEEDBACK_BASE_URL: ${{ secrets.FEEDBACK_BASE_URL }}
          TRACK_BASE_URL: ${{ secrets.TRACK_BASE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SOCIAL_ENABLED: 'false'
          DEBUG_SAVE: 'true'
        run: python pipeline.py

      - name: Persist editorial memory
        # Isolado: a newsletter já foi enviada no passo anterior. Qualquer falha de git
        # (branch protection, detached HEAD, etc.) NÃO pode falhar o job nem afetar o envio.
        # scripts/persist_to_git.sh faz retry do push e, se esgotar, avisa alto (step
        # summary + exit != 0) em vez de engolir a falha em silêncio.
        if: success() && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: 'scripts/persist_to_git.sh memory/editions.jsonl "chore(memory): registra edição ${{ steps.edition.outputs.number }}"'

      - name: Persist notices (aviso ao leitor — one-shot)
        # Mesmo isolamento dos demais passos de persistência: a newsletter já foi
        # enviada, falha de git aqui não pode afetar o envio. notices.py já apagou
        # o pending.json localmente no runner se ele foi usado nesta edição — esse
        # passo só leva a limpeza (+ o log em sent_log.jsonl) de volta pro repo.
        if: success() && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: 'scripts/persist_to_git.sh notices/ "chore(notices): registra aviso da edição ${{ steps.edition.outputs.number }}"'

      - name: Persist vault note (Stage A — outbox pro vault pessoal)
        # Mesmo isolamento do passo de memória editorial: a newsletter já foi enviada,
        # falha de git aqui não pode afetar o envio. A cópia real pro vault (Stage B)
        # roda localmente — ver scripts/sync_to_vault.py.
        if: success() && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: 'scripts/persist_to_git.sh vault-outbox/ "chore(vault): nota da edição ${{ steps.edition.outputs.number }}"'

      - name: Upload output artifacts (newsletter + social)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edition-${{ steps.edition.outputs.number }}
          path: output/
          retention-days: 30

      - name: Upload debug artifacts (curation + pre-filter data)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-${{ steps.edition.outputs.number }}
          path: debug/
          retention-days: 30

      - name: Upload pipeline logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-logs-${{ steps.edition.outputs.number }}
          path: "*.log"
          retention-days: 7
