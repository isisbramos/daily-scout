name: "AYA — Site — lista de edições"

# Atualiza archive/editions.json (lista de todas as edições no site) a partir do
# arquivo público do Buttondown. Não usa secrets nem LLM e não toca no pipeline.
# Roda depois de cada execução do pipeline diário e, como rede de segurança, às 15h BRT.

on:
  workflow_run:
    workflows: ["Daily Scout Pipeline"]
    types: [completed]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Reabrir todas as edições (lento, ~8 min)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: site-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build editions.json
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            python scripts/build_archive.py --full
          else
            python scripts/build_archive.py
          fi

      - name: Commit
        run: |
          if git diff --quiet -- archive/editions.json; then
            echo "editions.json sem mudança"
            exit 0
          fi
          git config user.name "aya-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/editions.json
          git commit -m "chore(site): atualiza lista de edições"
          git pull --rebase --autostash origin main || echo "pull --rebase falhou — seguindo para push"
          git push origin HEAD:main || echo "push falhou — lista não atualizada (sem impacto no pipeline)"
