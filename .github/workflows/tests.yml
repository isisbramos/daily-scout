name: Tests

# Roda a suíte pytest em push/PR que tocam código Python ou dependências —
# antes disso, os 125 testes em tests/ só rodavam se alguém lembrasse de
# rodar local, então um bump de dependência (ex: pytest) podia quebrar a
# suíte sem ninguém notar. Isolado do pipeline da newsletter de propósito:
# uma falha aqui NUNCA pode bloquear o envio diário.

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v
