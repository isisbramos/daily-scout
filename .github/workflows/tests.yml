name: Tests

# Roda a suíte pytest em push/PR que tocam código Python ou dependências —
# antes disso, os 125 testes em tests/ só rodavam se alguém lembrasse de
# rodar local, então um bump de dependência (ex: pytest) podia quebrar a
# suíte sem ninguém notar. Isolado do pipeline da newsletter de propósito:
# uma falha aqui NUNCA pode bloquear o envio diário.
#
# Roda também semanal (schedule): requirements.txt/requirements-dev.txt pinam
# versão exata, mas dependências TRANSITIVAS não são pinadas — podem mudar no
# PyPI sem ninguém tocar neste repo. Mesmo racional do security.yml/codeql.yml.
#
# Cada run registra o resultado em ci/test_runs.jsonl (histórico consumido por
# dashboard.py) — só no push/schedule/workflow_dispatch, NUNCA em pull_request:
# um PR roda numa branch própria, e commitar de volta em HEAD:main a partir de
# uma run de PR empurraria conteúdo da branch pra main sem passar por merge.

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/tests.yml'
  schedule:
    # Segunda-feira 08:00 UTC — depois do security.yml (06:00) e do codeql.yml (07:00)
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v --junitxml=pytest-results.xml

      - name: Record test run (histórico pro dashboard)
        if: always()
        run: python scripts/record_test_run.py pytest-results.xml

      - name: Persist test run history
        # Nunca em pull_request — ver comentário no topo do arquivo. continue-on-error
        # porque isso é telemetria: uma falha aqui não pode mascarar o resultado real
        # dos testes acima nem quebrar o job por um motivo não relacionado a eles.
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: 'scripts/persist_to_git.sh ci/test_runs.jsonl "chore(ci): registra resultado de teste (${{ github.event_name }})"'
